name: "greenfield-delivery"
description: "Fluxo enterprise ponta a ponta com gates determinísticos e Challenge Loops bidirecionais (Inspirado no KONIG e auditado pelo ARC)"
version: "2.1.0"

steps:
  - id: step_01_prd
    task: "create-prd"
    agent: "pm"
    template: "prd-template.md"
    gate: "prd-gate-checklist"
    depends_on: []

  - id: step_02_architecture
    task: "design-architecture"
    agent: "architect"
    template: "architecture-template.md"
    gate: "architecture-gate-checklist"
    depends_on: ["step_01_prd"]
    challenge_channel:
      target_agent: "pm"
      trigger: "inconsistencia_escopo_ou_inviabilidade"

  - id: step_03_ui_ux
    task: "design-ui-ux-pro-max"
    agent: "ui_ux_designer"
    template: "ui-ux-tokens-template.md"
    gate: "ui-ux-pro-max-gate-checklist"
    depends_on: ["step_01_prd"]
    challenge_channel:
      target_agent: "pm"
      trigger: "conflito_topologia_marca_ou_persona"

  - id: step_04_implementation
    task: "implement-fullstack-core"
    agent: "engineer"
    gate: "code-quality-gate-checklist"
    depends_on: ["step_02_architecture", "step_03_ui_ux"]
    challenge_channel:
      target_agents: ["architect", "ui_ux_designer"]
      trigger: "challenge-spec"
      action: "rejeicao_com_evidencias_e_ajuste_de_contrato"

  - id: step_05_qa
    task: "run-qa-homologation"
    agent: "qa_engineer"
    template: "qa-report-template.md"
    gate: "qa-gate-checklist"
    depends_on: ["step_04_implementation"]
    challenge_channel:
      target_agents: ["engineer", "pm"]
      trigger: "challenge-contract"
      action: "devolucao_imediata_com_relatorio_de_falha"
