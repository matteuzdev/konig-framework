name: Colisseum Regression Checks
on:
  pull_request:
    paths:
      - 'core/**'
      - 'cli.py'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/colisseum-regression.yml'
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest httpx
      - name: Run regression tests
        run: python -m pytest -q tests
