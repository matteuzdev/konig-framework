# Protocolo de decisão
coliseu_protocol: "core/council/coliseu_protocol.md"

# Regras de aplicação
injection_rules:
  - "Injeção = referência consultiva apenas. O agente NÃO incorpora a persona do conselheiro."
  - "Agente consulta a seção indicada no source_file quando acionado por ONIX via Coliseu."
  - "Variáveis {{...}} são resolvidas em tempo de execução pelo ONIX (meta_orchestrator)."
  - "Cada injeção contém: frameworks operacionais, template de análise, handoffs KONIG."
  - "Nenhum agente tem autoridade para vetar veredito do Coliseu. Apenas executa tasks despachadas."