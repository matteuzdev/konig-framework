[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "konig-framework"
version = "2.0.0"
description = "KONIG Framework — Enterprise Autonomous Agent Orchestration Engine"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Hianto", email = "contact@konig.dev"}
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydantic>=2.5.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "rich>=13.7.0",
    "click>=8.1.7",
    "litellm>=1.20.0",
    "httpx>=0.26.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
]

[project.scripts]
konig = "cli:main"

[tool.setuptools]
packages = ["core", "core.engine", "core.llm", "core.memory", "core.primitives", "core.runtime", "channels"]
py-modules = ["cli", "main"]
