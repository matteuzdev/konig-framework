[project]
name = "konig-reach"
version = "0.2.0"
description = "Experimental policy-gated web extraction"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1", "beautifulsoup4>=4.12,<5"]
[project.optional-dependencies]
test = ["pytest>=8,<10"]
[project.scripts]
konig-reach = "konig_reach.cli:main"
[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]
